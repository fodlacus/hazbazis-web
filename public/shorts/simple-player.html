<!DOCTYPE html>
<html lang="hu">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <title>Házbázis Shorts</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

      <style>
            /* SÖTÉT HÁTTÉR AZ ASZTALI NÉZETHEZ */
            body {
                  background-color: #121212;
                  margin: 0;
                  overflow: hidden;
                  display: flex;
                  justify-content: center;
                  /* Középre igazítás asztalon */
                  height: 100vh;
                  height: 100dvh;
                  /* Mobilon a címsor miatt jobb */
            }

            /* A MOBIL KERET (Hogy ne legyen óriási asztalon) */
            #app-container {
                  width: 100%;
                  max-width: 480px;
                  /* Ennél szélesebb nem lehet (TikTok standard) */
                  height: 100%;
                  position: relative;
                  background: #000;
                  overflow: hidden;
                  box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            }

            /* GÖRGETŐ KONTÉNER */
            #video-scroll-container {
                  height: 100%;
                  width: 100%;
                  overflow-y: scroll;
                  scroll-snap-type: y mandatory;
                  scroll-behavior: smooth;
                  scrollbar-width: none;
                  /* Firefox görgetősáv elrejtés */
            }

            #video-scroll-container::-webkit-scrollbar {
                  display: none;
            }

            /* Chrome görgetősáv elrejtés */

            /* EGY VIDEÓ KÁRTYA */
            .video-card {
                  height: 100%;
                  width: 100%;
                  scroll-snap-align: start;
                  position: relative;
                  background: #000;
                  display: flex;
                  justify-content: center;
                  align-items: center;
            }

            video {
                  height: 100%;
                  width: 100%;
                  object-fit: cover;
                  /* Kitölti a keretet */
            }

            /* --- VEZÉRLŐ GOMBOK (JOBB OLDAL) --- */
            .sidebar-actions {
                  position: absolute;
                  right: 12px;
                  bottom: 140px;
                  /* Kicsit feljebb, hogy ne lógjon bele a szövegbe */
                  display: flex;
                  flex-direction: column;
                  gap: 16px;
                  /* Távolság a gombok között */
                  z-index: 50;
                  align-items: center;
            }

            .action-btn {
                  width: 48px;
                  height: 48px;
                  border-radius: 50%;
                  background: rgba(0, 0, 0, 0.4);
                  border: 1px solid rgba(255, 255, 255, 0.2);
                  color: white;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  font-size: 20px;
                  cursor: pointer;
                  backdrop-filter: blur(4px);
                  transition: all 0.2s ease;
                  text-decoration: none;
                  /* Linkek miatt */
            }

            .action-btn:active {
                  transform: scale(0.9);
            }

            .action-btn:hover {
                  background: rgba(255, 255, 255, 0.1);
            }

            .is-favorite {
                  color: #ff4b4b;
                  border-color: #ff4b4b;
                  background: rgba(255, 75, 75, 0.1);
            }

            /* --- HANG GOMB (KÜLÖN, BAL FENT VAGY JOBB OLDALON) --- */
            /* Most betettem a jobb oldali sávba, a Kedvenc alá */

            /* --- ALSÓ INFÓK --- */
            .info-overlay {
                  position: absolute;
                  bottom: 0;
                  left: 0;
                  width: 100%;
                  padding: 20px;
                  padding-bottom: 40px;
                  /* Hely az iPhone alsó csíknak */
                  background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0) 100%);
                  color: white;
                  pointer-events: none;
                  z-index: 40;
            }

            /* Címkék stílusa */
            .badge {
                  background-color: #bef264;
                  /* lime-300 */
                  color: #1a2e05;
                  font-size: 0.75rem;
                  font-weight: 800;
                  padding: 4px 8px;
                  border-radius: 6px;
                  margin-bottom: 8px;
                  display: inline-block;
            }
      </style>
</head>

<body>

      <div id="app-container">

            <div id="video-scroll-container">
            </div>

            <div id="loading" class="absolute inset-0 flex items-center justify-center bg-black z-[60] text-white">
                  <div class="text-center">
                        <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4 text-lime-400"></i>
                        <p>Betöltés...</p>
                  </div>
            </div>

            <div class="absolute top-6 left-4 z-50">
                  <button onclick="window.history.back()"
                        class="bg-black/40 backdrop-blur-md text-white px-4 py-2 rounded-full text-sm font-bold border border-white/20 flex items-center gap-2">
                        <i class="fa-solid fa-chevron-left"></i> Vissza
                  </button>
            </div>

      </div>

      <script type="module">
            // 1. IMPORTÁLÁS (Útvonal: shorts mappából -> public gyökér -> src -> js -> util)
            import { adatbazis } from '../src/js/util/firebase-config.js';
            import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

            let osszesVideo = [];
            let jelenlegiVideoIndex = 0;
            let isMuted = true; // Alapból némítva (böngésző szabályok miatt)

            // --- INDÍTÁS ---
            document.addEventListener('DOMContentLoaded', async () => {
                  await adatBetoltes();
            });

            // --- ADATOK LEKÉRÉSE ÉS SZŰRÉSE ---
            async function adatBetoltes() {
                  try {
                        console.log("🔥 Adatok lekérése...");
                        const snapshot = await getDocs(collection(adatbazis, "lakasok"));

                        let nyersLista = [];
                        snapshot.forEach(doc => {
                              const data = doc.data();
                              if (data.videoUrl && data.videoUrl.length > 5) {
                                    nyersLista.push({ id: doc.id, ...data });
                              }
                        });

                        // SZŰRÉS LOGIKA (SessionStorage)
                        const szuroListaStr = sessionStorage.getItem('shorts_playlist');
                        if (szuroListaStr) {
                              try {
                                    const szuroLista = JSON.parse(szuroListaStr);
                                    const szurt = nyersLista.filter(item => szuroLista.includes(item.id));

                                    if (szurt.length > 0) {
                                          osszesVideo = szurt;
                                          console.log("✅ Szűrt lista:", szurt.length, "db");
                                    } else {
                                          osszesVideo = nyersLista;
                                    }
                              } catch (e) {
                                    osszesVideo = nyersLista;
                              }
                        } else {
                              osszesVideo = nyersLista;
                        }

                        rendereles();
                        figyeloInditasa();

                  } catch (err) {
                        console.error("Hiba:", err);
                  } finally {
                        document.getElementById('loading').style.display = 'none';
                  }
            }

            // --- MEGJELENÍTÉS (HTML GENERÁLÁS) ---
            function rendereles() {
                  const container = document.getElementById('video-scroll-container');
                  container.innerHTML = '';

                  if (osszesVideo.length === 0) {
                        container.innerHTML = '<div class="h-full flex items-center justify-center text-white">Nincs videó.</div>';
                        return;
                  }

                  osszesVideo.forEach((ingatlan, index) => {
                        const ar = ingatlan.vételár ? (ingatlan.vételár / 1000000).toFixed(1) + " M" : "Ár megegyezés szerint";
                        const cim = ingatlan.telepules || "Ingatlan";
                        const utca = ingatlan.utca || "";
                        const meret = ingatlan.alapterület ? `${ingatlan.alapterület} m²` : "";
                        const szoba = ingatlan.szobák ? `${ingatlan.szobák} szoba` : "";

                        const html = `
                    <div class="video-card" id="card-${index}">
                        <video loop playsinline muted poster="${ingatlan.boritokep || ''}" class="video-player">
                            <source src="${ingatlan.videoUrl}" type="video/mp4">
                        </video>

                        <div class="sidebar-actions">
                            
                            <div class="action-btn" onclick="goHome()">
                                <i class="fa-solid fa-house"></i>
                            </div>

                            <div class="action-btn" onclick="goToSearch()">
                                <i class="fa-solid fa-filter"></i>
                            </div>

                            <div class="action-btn" onclick="openBus()">
                                <i class="fa-solid fa-bus"></i>
                            </div>
                            
                            <div class="action-btn" onclick="toggleFav(this)">
                                <i class="fa-regular fa-heart"></i>
                            </div>

                            <div class="action-btn" onclick="toggleSound(this)">
                                <i class="fa-solid fa-volume-xmark"></i>
                            </div>

                            <div class="action-btn" onclick="openDetails('${ingatlan.id}')">
                                <i class="fa-regular fa-file-lines"></i>
                            </div>
                        </div>

                        <div class="info-overlay">
                            <div class="badge">${ingatlan.id}</div>
                            <h2 class="text-2xl font-bold mb-1 drop-shadow-md leading-tight">${cim}</h2>
                            <p class="text-lg font-medium mb-1 text-lime-300 drop-shadow-md">
                                ${ar} <span class="text-white text-sm font-normal">• ${meret} • ${szoba}</span>
                            </p>
                            <p class="text-sm opacity-90 drop-shadow-md flex items-center gap-2">
                                <i class="fa-solid fa-location-dot text-xs"></i> ${utca}
                            </p>
                        </div>
                    </div>
                `;
                        container.innerHTML += html;
                  });
            }

            // --- GOMB FUNKCIÓK ---

            window.toggleSound = function (btn) {
                  isMuted = !isMuted; // Állapot váltás
                  const icon = btn.querySelector('i');

                  // Minden videóra érvényesítjük (hogy görgetésnél ne ordítson fel hirtelen)
                  document.querySelectorAll('video').forEach(vid => {
                        vid.muted = isMuted;
                  });

                  // Ikon csere
                  if (isMuted) {
                        icon.className = 'fa-solid fa-volume-xmark';
                        // Opcionális: Vizuális visszajelzés
                  } else {
                        icon.className = 'fa-solid fa-volume-high';
                  }
            };

            window.goHome = function () { window.location.href = '../../index.html'; };

            window.goToSearch = function () { window.location.href = '../../src/search/search-index.html'; };

            window.openBus = function () {
                  alert("🚧 Fejlesztés alatt!\n\nA BKK menetrend integrációja hamarosan érkezik. 🚌");
            };

            window.toggleFav = function (btn) {
                  const icon = btn.querySelector('i');
                  if (icon.classList.contains('fa-regular')) {
                        icon.classList.remove('fa-regular');
                        icon.classList.add('fa-solid');
                        btn.classList.add('is-favorite');
                  } else {
                        icon.classList.remove('fa-solid');
                        icon.classList.add('fa-regular');
                        btn.classList.remove('is-favorite');
                  }
            };

            window.openDetails = function (id) {
                  const ingatlan = osszesVideo.find(x => x.id === id);

                  // Státusz ellenőrzés
                  if (ingatlan && ingatlan.statusz && ingatlan.statusz !== 'Aktív' && ingatlan.statusz !== 'Active') {
                        alert("⚠️ Ez az adatlap még generálás alatt áll.");
                        return;
                  }

                  const tisztaId = id.replace('HB-', '');
                  window.location.href = `../../src/html/vevo/adatlap.html?id=HB-${tisztaId}`;
            };

            // --- SCROLL FIGYELŐ (Auto-Play) ---
            function figyeloInditasa() {
                  const options = { threshold: 0.6 };

                  const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                              const video = entry.target.querySelector('video');
                              if (entry.isIntersecting) {
                                    // Ha látszik: Indul
                                    video.muted = isMuted; // Mindig a globális beállítást követi
                                    video.currentTime = 0; // Elejéről kezdi
                                    video.play().catch(e => console.log("Autoplay blokkolva:", e));
                              } else {
                                    // Ha nem látszik: Állj
                                    video.pause();
                              }
                        });
                  }, options);

                  document.querySelectorAll('.video-card').forEach(card => {
                        observer.observe(card);
                  });
            }

      </script>
</body>

</html>
