<!DOCTYPE html>
<html lang="hu">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <title>Házbázis Shorts | Prémium Ingatlanok</title>

      <script src="https://cdn.tailwindcss.com"></script>
      <link rel="stylesheet" href="css/shorts-style.css">

      <script>
            // Adatfigyelő a DataManager számára
            Object.defineProperty(window, 'lakasok', {
                  set: function (val) {
                        console.log("!!! ADAT MEGÉRKEZETT !!!", val.length, "db");

                        // --- ITT A TRÜKK: SZŰRJÜK A BEJÖVŐ ADATOT A KERESŐ ALAPJÁN ---
                        const playlistStr = sessionStorage.getItem('shorts_playlist');
                        if (playlistStr) {
                              try {
                                    const allowedIds = JSON.parse(playlistStr);
                                    console.log("🔍 Szűrés aktív:", allowedIds);
                                    // Csak azokat hagyjuk meg, amik benne vannak a listában
                                    const filtered = val.filter(item => allowedIds.includes(item.id));

                                    if (filtered.length > 0) {
                                          this._lakasok = filtered;
                                          console.log("✅ Szűrt lista beállítva:", filtered.length, "db");
                                    } else {
                                          console.warn("⚠️ A szűrés üres listát eredményezett, marad az eredeti.");
                                          this._lakasok = val;
                                    }

                                    // Töröljük a filtert, hogy legközelebb friss legyen (opcionális)
                                    // sessionStorage.removeItem('shorts_playlist');
                              } catch (e) {
                                    console.error("Hiba a playlist olvasásakor:", e);
                                    this._lakasok = val;
                              }
                        } else {
                              this._lakasok = val;
                        }
                  },
                  get: function () { return this._lakasok; },
                  configurable: true
            });
      </script>
</head>

<body class="bg-black text-white overflow-hidden">

      <a href="src/search/search-index.html"
            class="fixed top-4 left-4 z-[100] bg-black/50 backdrop-blur text-white p-3 rounded-full border border-white/20 hover:bg-white/20 transition">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor" class="w-6 h-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg>
      </a>

      <main id="shorts-container" class="video-feed"></main>

      <div id="filter-modal"
            class="fixed inset-0 bg-black/95 z-[200] hidden flex flex-col justify-end md:justify-center items-center backdrop-blur-md">
            <div
                  class="bg-[#121212] w-full md:w-[500px] h-[85vh] md:h-auto md:max-h-[85vh] rounded-t-3xl md:rounded-3xl p-6 border-t md:border border-white/10 shadow-2xl flex flex-col">
                  <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold">Keresési segédlet 🌍</h3>
                        <button onclick="window.UI.closeModal()"
                              class="p-2 bg-white/10 rounded-full hover:bg-white/20">✕</button>
                  </div>
                  <div id="modal-content-grid" class="grid grid-cols-2 gap-3 overflow-y-auto flex-1 pb-4"></div>
                  <button id="reset-filter-btn"
                        class="w-full mt-4 py-3 rounded-xl border border-white/20 font-bold bg-white/5 hover:bg-white/10 transition">🔄
                        Összes ingatlan mutatása</button>
            </div>
      </div>

      <script type="module">
            import { ShortsEngine } from './js/engine/shorts-engine.js';
            import { UIManager } from './js/core/ui-manager.js';
            import { FilterRegistry } from './js/core/filter-registry.js';
            import { FavLogic } from './js/strategies/fav-logic.js';
            import { auth } from '../src/js/util/firebase-config.js'; // ÚTVONAL ELLENŐRZÉS!
            import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

            window.executeFilter = async (tileId, params = null) => {
                  if (typeof window.executeFilterInternal === 'function') { await window.executeFilterInternal(tileId, params); }
            };

            document.addEventListener('DOMContentLoaded', () => {
                  onAuthStateChanged(auth, async (user) => {
                        if (user) {
                              window.currentUser = { azon: user.uid };
                              await FavLogic.init(user.uid);
                        } else {
                              window.currentUser = null;
                        }
                        await ShortsEngine.init('shorts-container');
                        UIManager.init();
                  });
            });

            window.handleToggleFav = async function (hbAzon, btnElement) {
                  const userAzon = window.currentUser?.azon;
                  if (!userAzon) { alert("A kedvencek mentéséhez be kell jelentkezned!"); return; }
                  btnElement.style.opacity = "0.5"; btnElement.style.pointerEvents = "none";
                  try {
                        const { FavLogic } = await import('./js/strategies/fav-logic.js');
                        const isActive = await FavLogic.toggleFavorite(hbAzon, userAzon);
                        const svg = btnElement.querySelector('svg');
                        if (isActive) { btnElement.classList.add('is-favorite'); svg.setAttribute('fill', '#ff4b4b'); } else { btnElement.classList.remove('is-favorite'); svg.setAttribute('fill', 'currentColor'); }
                  } catch (err) { console.error("Fav hiba:", err); } finally { btnElement.style.opacity = "1"; btnElement.style.pointerEvents = "auto"; }
            };

            window.openDetails = function (hbAzon) {
                  if (!hbAzon) return;
                  const tisztaSzam = hbAzon.toString().replace('HB-', '').trim();
                  const veglegesId = 'HB-' + tisztaSzam;
                  window.location.href = `../../src/html/vevo/adatlap.html?id=${veglegesId}`;
            };
      </script>
</body>

</html>
