<!DOCTYPE html>
<html lang="hu">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <title>Házbázis Shorts</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <style>
            body {
                  margin: 0;
                  padding: 0;
                  background-color: #000;
                  font-family: sans-serif;
                  overflow: hidden;
                  height: 100dvh;
            }

            /* A GÖRGETŐ KONTÉNER */
            .video-feed {
                  height: 100dvh;
                  width: 100%;
                  overflow-y: scroll;
                  scroll-snap-type: y mandatory;
                  scroll-behavior: smooth;
                  -ms-overflow-style: none;
                  scrollbar-width: none;
            }

            .video-feed::-webkit-scrollbar {
                  display: none;
            }

            /* EGY VIDEÓ PANEL */
            .video-container {
                  position: relative;
                  height: 100dvh;
                  width: 100%;
                  scroll-snap-align: start;
                  scroll-snap-stop: always;
                  background: #000;
                  display: flex;
                  justify-content: center;
                  align-items: center;
            }

            video,
            .video-placeholder {
                  height: 100%;
                  width: 100%;
                  object-fit: cover;
                  max-width: 500px;
                  /* Modern mobil szélesség */
            }

            /* OVERLAY - Adatok a videón */
            .video-overlay {
                  position: absolute;
                  bottom: 0;
                  left: 50%;
                  transform: translateX(-50%);
                  width: 100%;
                  max-width: 500px;
                  height: 100%;
                  pointer-events: none;
                  display: flex;
                  flex-direction: column;
                  justify-content: flex-end;
                  padding: 20px;
                  padding-bottom: 40px;
                  background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, transparent 50%);
                  z-index: 10;
            }

            .video-info {
                  pointer-events: auto;
                  color: white;
                  margin-bottom: 20px;
            }

            .brand-badge {
                  background: #E2F1B0;
                  color: #3D4A16;
                  padding: 4px 10px;
                  border-radius: 6px;
                  font-size: 0.7rem;
                  font-weight: 800;
                  display: inline-block;
                  margin-bottom: 8px;
                  text-transform: uppercase;
            }

            /* FIX GOMBOK (Oldalt) */
            .side-controls {
                  position: absolute;
                  right: 15px;
                  bottom: 100px;
                  display: flex;
                  flex-direction: column;
                  gap: 18px;
                  z-index: 100;
            }

            .control-btn {
                  width: 48px;
                  height: 48px;
                  border-radius: 50%;
                  background: rgba(255, 255, 255, 0.15);
                  backdrop-filter: blur(10px);
                  border: 1px solid rgba(255, 255, 255, 0.2);
                  color: white;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  cursor: pointer;
                  transition: 0.2s;
            }

            .control-btn:active {
                  transform: scale(0.9);
                  background: #E2F1B0;
                  color: #000;
            }

            /* MODAL JAVÍTÁS */
            #filter-modal.active {
                  display: flex;
            }

            #filter-modal.active #filter-content {
                  transform: translateY(0);
            }
      </style>
</head>

<body>

      <div class="video-feed" id="main-feed">
      </div>

      <div class="side-controls">
            <button class="control-btn" onclick="toggleFilter(true)">🔍</button>
            <button class="control-btn" onclick="window.location.reload()">🔄</button>
            <button class="control-btn" onclick="window.location.href='/'">🏠</button>
      </div>

      <div id="filter-modal"
            class="fixed inset-0 bg-black/90 z-[200] hidden flex-col justify-end items-center backdrop-blur-md">
            <div id="filter-content"
                  class="bg-[#121212] w-full max-w-lg rounded-t-3xl p-6 border-t border-white/10 transition-transform duration-300 translate-y-full">
                  <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold text-white">Felfedezés 🌍</h3>
                        <button onclick="toggleFilter(false)" class="text-white text-2xl">✕</button>
                  </div>
                  <div id="discovery-grid" class="grid grid-cols-2 gap-3 h-[50vh] overflow-y-auto mb-4">
                  </div>
            </div>
      </div>

      <script type="module">
            import { collection, getDocs, query, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
            import { adatbazis } from "../js/util/firebase-config.js";

            const feed = document.getElementById('main-feed');

            // FUNKCIÓ: Videók betöltése az adatbázisból
            async function loadShorts() {
                  feed.innerHTML = '<div class="text-white p-10 text-center">Ingatlanok betöltése...</div>';

                  try {
                        const q = query(collection(adatbazis, "lakasok"), limit(10));
                        const snap = await getDocs(q);
                        feed.innerHTML = '';

                        snap.forEach(doc => {
                              const data = doc.data();
                              const videoUrl = data.video_url || ""; // Ha van videó meződ
                              const imgUrl = data.kepek_vert ? data.kepek_vert[0] : "https://placehold.co/600x1000?text=Nincs+videó";

                              const container = document.createElement('div');
                              container.className = 'video-container';
                              container.innerHTML = `
                        ${videoUrl ?
                                          `<video src="${videoUrl}" loop playsinline muted></video>` :
                                          `<img src="${imgUrl}" class="video-placeholder">`
                                    }
                        <div class="video-overlay">
                            <div class="video-info">
                                <span class="brand-badge">${data.kerulet || 'Budapest'}</span>
                                <h2 class="text-xl font-bold">${data.nev || 'Prémium lakás'}</h2>
                                <p class="text-lime-400 font-bold text-lg">${Number(data.vételár).toLocaleString()} Ft</p>
                                <p class="text-sm opacity-80">${data.alapterület} m² • ${data.szobák} szoba</p>
                                <button onclick="window.location.href='adatlap.html?id=${doc.id}'" class="mt-4 pointer-events-auto bg-white/20 backdrop-blur px-4 py-2 rounded-lg text-sm font-bold border border-white/20">
                                    Adatlap megnyitása →
                                </button>
                            </div>
                        </div>
                    `;

                              // Kattintásra Play/Pause (ha videó)
                              container.addEventListener('click', () => {
                                    const v = container.querySelector('video');
                                    if (v) v.paused ? v.play() : v.paused();
                              });

                              feed.appendChild(container);
                        });

                        // Automatikus lejátszás az elsőhöz (láthatóság alapján érdemes finomítani)
                        const firstVideo = feed.querySelector('video');
                        if (firstVideo) firstVideo.play();

                  } catch (err) {
                        console.error(err);
                        feed.innerHTML = '<div class="text-white p-10 text-center">Hiba történt a betöltéskor.</div>';
                  }
            }

            // Modal kezelő
            window.toggleFilter = (show) => {
                  const modal = document.getElementById('filter-modal');
                  if (show) {
                        modal.classList.add('active');
                        modal.classList.remove('hidden');
                  } else {
                        modal.classList.remove('active');
                        setTimeout(() => modal.classList.add('hidden'), 300);
                  }
            };

            loadShorts();
      </script>
</body>

</html>
