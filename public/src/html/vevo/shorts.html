<!DOCTYPE html>
<html lang="hu">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <title>Házbázis Shorts</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <style>
            /* --- ALAPBEÁLLÍTÁSOK (Visszaállítva a működő verzióra) --- */
            body {
                  margin: 0;
                  padding: 0;
                  background-color: #000;
                  overflow: hidden;
                  /* Fontos: megakadályozza a dupla görgetősávot */
            }


            .video-feed {
                  height: 100dvh;
                  width: 100%;
                  overflow-y: scroll;
                  scroll-snap-type: y mandatory;
                  scroll-behavior: smooth;
                  -ms-overflow-style: none;
                  scrollbar-width: none;
            }

            .video-feed::-webkit-scrollbar {
                  display: none;
            }

            /* --- A VIDEÓ KÁRTYA (Ez a legfontosabb!) --- */
            .video-container {
                  position: relative;
                  height: 100dvh;
                  width: 100%;
                  /* Asztali gépen korlátozzuk a szélességet */
                  max-width: 450px;
                  margin: 0 auto;
                  /* Középre helyezi az egész sávot */
                  scroll-snap-align: start;
                  scroll-snap-stop: always;
                  background: #000;
            }

            /* --- VIDEÓ MÉRETEZÉS --- */
            video {
                  width: 100%;
                  height: 100%;
                  object-fit: cover;
            }

            /* --- OVERLAY (Szöveg és gombok) --- */
            .video-overlay {
                  position: absolute;
                  inset: 0;
                  /* Kitölti a container-t */
                  pointer-events: none;
                  display: flex;
                  flex-direction: column;
                  justify-content: flex-end;
                  padding: 20px;
                  padding-bottom: 60px;
                  background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, transparent 40%);
            }

            /* --- JOBB OLDALI GOMBOK --- */
            .controls {
                  position: absolute;
                  right: 15px;
                  bottom: 80px;
                  display: flex;
                  flex-direction: column;
                  gap: 15px;
                  pointer-events: auto;
                  z-index: 100;
            }


            .controls button,
            .menu-btn {
                  width: 45px;
                  height: 45px;
                  border-radius: 50%;
                  background: rgba(0, 0, 0, 0.4);
                  backdrop-filter: blur(4px);
                  border: 1px solid rgba(255, 255, 255, 0.2);
                  color: white;
                  font-size: 1.2rem;
                  cursor: pointer;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  transition: all 0.2s;
                  text-decoration: none;
            }

            .controls button:active {
                  transform: scale(0.9);
                  background: #E2F1B0;
                  color: black;
            }

            .control-circle {
                  width: 44px;
                  height: 44px;
                  border: 1px solid #E2F1B0;
                  /* Vékony keret */
                  border-radius: 50%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  background: rgba(0, 0, 0, 0.4);
                  backdrop-filter: blur(4px);
                  transition: all 0.2s ease;
            }

            /* --- SZÖVEGEK --- */
            video-info {
                  pointer-events: auto;
                  width: calc(100% - 60px);
                  /* Hogy ne takarják el a gombok */
            }


            .video-info h3 {
                  margin: 0 0 4px 0;
                  font-size: 1.1rem;
                  text-shadow: 1px 1px 2px black;
                  color: white;
                  line-height: 1.3;
            }

            .specs {
                  font-size: 0.85rem !important;
                  color: #E2F1B0 !important;
                  font-weight: bold;
                  margin-top: 4px;
            }

            .brand-badge {
                  background: #E2F1B0;
                  color: #3D4A16;
                  padding: 2px 8px;
                  border-radius: 4px;
                  font-size: 0.75rem;
                  font-weight: 800;
                  margin-bottom: 6px;
                  display: inline-block;
            }

            /* --- PLAY IKON (Középen) --- */
            .play-icon {
                  position: absolute;
                  top: 50%;
                  left: 50%;
                  transform: translate(-50%, -50%);
                  font-size: 4rem;
                  color: rgba(255, 255, 255, 0.7);
                  pointer-events: none;
                  opacity: 0;
                  transition: opacity 0.2s;
            }

            .no-scrollbar {
                  -ms-overflow-style: none;
                  scrollbar-width: none;
            }

            .filter-active {
                  background-color: #E2F1B0 !important;
                  border-color: #3D4A16 !important;
            }

            .filter-active svg {
                  stroke: #3D4A16 !important;
            }
      </style>
</head>

<body>





      <div class="video-feed"></div>

      <div id="filter-modal"
            class="fixed inset-0 bg-black/95 z-[200] hidden flex flex-col justify-end md:justify-center items-center backdrop-blur-md">
            <div class="bg-[#121212] w-full md:w-[500px] h-[85vh] md:h-auto md:max-h-[85vh] rounded-t-3xl md:rounded-3xl p-6 border-t md:border border-white/10 shadow-2xl flex flex-col"
                  id="filter-content">

                  <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold text-white">Felfedezés 🌍</h3>
                        <button
                              class="close-filter-btn p-2 bg-white/10 rounded-full text-white hover:bg-white/20">✕</button>
                  </div>

                  <div id="discovery-grid" class="grid grid-cols-2 gap-3 overflow-y-auto flex-1 pb-4 pr-1">
                  </div>

                  <button onclick="window.szuroTorlese();"
                        class="close-filter-btn w-full mt-4 py-3 rounded-xl border border-white/20 text-white font-bold hover:bg-white/10 transition bg-white/5">
                        🔄 Minden videó mutatása
                  </button>
            </div>
      </div>

      <script type="module" src="../../js/vevo/shorts-engine.js"></script>

</body>

</html>
