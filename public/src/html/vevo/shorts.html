<!DOCTYPE html>
<html lang="hu">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <title>Házbázis Shorts</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <style>
            body {
                  margin: 0;
                  padding: 0;
                  background-color: #000;
                  font-family: Arial, sans-serif;
                  overflow: hidden;
                  height: 100dvh;
            }

            /* Videó görgetés */
            .video-feed {
                  height: 100dvh;
                  width: 100%;
                  overflow-y: scroll;
                  scroll-snap-type: y mandatory;
                  scroll-behavior: smooth;
            }

            .video-feed::-webkit-scrollbar {
                  display: none;
            }

            /* Videó kártya */
            .video-container {
                  position: relative;
                  height: 100dvh;
                  width: 100%;
                  scroll-snap-align: start;
                  scroll-snap-stop: always;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  background: #000;
                  overflow: hidden;
            }

            video {
                  height: 100%;
                  width: 100%;
                  object-fit: cover;
                  max-width: 600px;
            }

            /* Overlay elemek */
            .video-overlay {
                  position: absolute;
                  bottom: 0;
                  left: 50%;
                  transform: translateX(-50%);
                  width: 100%;
                  max-width: 600px;
                  padding: 20px;
                  padding-bottom: 40px;
                  background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
                  pointer-events: none;
            }

            .controls {
                  position: absolute;
                  right: 15px;
                  bottom: 150px;
                  display: flex;
                  flex-direction: column;
                  gap: 20px;
                  pointer-events: auto;
                  z-index: 10;
            }

            /* Gombok */
            .controls button,
            .menu-btn {
                  width: 50px;
                  height: 50px;
                  border-radius: 50%;
                  background: rgba(255, 255, 255, 0.1);
                  backdrop-filter: blur(5px);
                  border: 1px solid rgba(255, 255, 255, 0.2);
                  color: white;
                  font-size: 1.5rem;
                  cursor: pointer;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  transition: all 0.2s;
                  text-decoration: none;
                  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            }

            .controls button:active {
                  transform: scale(0.9);
                  background: #E2F1B0;
                  color: black;
            }

            /* Szövegek */
            .video-info h3 {
                  margin: 0 0 5px 0;
                  font-size: 1.4rem;
                  text-shadow: 1px 1px 3px black;
                  color: white;
            }

            .specs {
                  font-size: 0.85rem !important;
                  color: #E2F1B0 !important;
                  margin-top: 5px !important;
                  font-weight: bold;
            }

            .brand-badge {
                  background: #E2F1B0;
                  color: #3D4A16;
                  padding: 4px 8px;
                  border-radius: 4px;
                  font-size: 0.8rem;
                  font-weight: 800;
                  margin-bottom: 5px;
                  display: inline-block;
            }

            /* Play Ikon */
            .play-icon {
                  position: absolute;
                  top: 50%;
                  left: 50%;
                  transform: translate(-50%, -50%);
                  font-size: 4rem;
                  color: rgba(255, 255, 255, 0.8);
                  pointer-events: none;
                  opacity: 0;
                  transition: opacity 0.2s;
            }
      </style>
</head>

<body>

      <div class="video-feed">
      </div>

      <div id="filter-modal"
            class="fixed inset-0 bg-black/95 z-[200] hidden flex flex-col justify-end md:justify-center items-center backdrop-blur-md">

            <div class="bg-[#121212] w-full md:w-[500px] h-[85vh] md:h-auto md:max-h-[85vh] rounded-t-3xl md:rounded-3xl p-6 border-t md:border border-white/10 shadow-2xl transform transition-transform duration-300 translate-y-full md:translate-y-0 flex flex-col"
                  id="filter-content">

                  <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold text-white">Felfedezés 🌍</h3>
                        <button
                              class="close-filter-btn p-2 bg-white/10 rounded-full text-white hover:bg-white/20">✕</button>
                  </div>

                  <div id="discovery-grid" class="grid grid-cols-2 gap-3 overflow-y-auto flex-1 pb-4 pr-1">
                  </div>

                  <button onclick="window.szuroTorlese();"
                        class="close-filter-btn w-full mt-4 py-3 rounded-xl border border-white/20 text-white font-bold hover:bg-white/10 transition bg-white/5">
                        🔄 Minden videó mutatása
                  </button>
            </div>
      </div>

      <script type="module" src="../../js/vevo/shorts-engine.js"></script>

</body>

</html>
