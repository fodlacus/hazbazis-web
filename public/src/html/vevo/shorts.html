<!DOCTYPE html>
<html lang="hu">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <title>Házbázis Shorts</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <style>
            /* A görgetés elrejtése, de a funkció megtartása */
            .no-scrollbar::-webkit-scrollbar {
                  display: none;
            }

            .no-scrollbar {
                  -ms-overflow-style: none;
                  scrollbar-width: none;
            }

            /* TikTok-szerű görgetés (Snap) */
            .snap-container {
                  scroll-snap-type: y mandatory;
                  overflow-y: scroll;
                  height: 100vh;
                  scroll-behavior: smooth;
            }

            .video-card {
                  scroll-snap-align: start;
                  height: 100vh;
                  width: 100%;
                  position: relative;
                  background: black;
            }
      </style>
</head>

<body class="bg-black text-white overflow-hidden">

      <a href="../../../index.html"
            class="absolute top-4 left-4 z-50 bg-black/50 p-2 rounded-full border border-white/20 backdrop-blur-md">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 12H5" />
                  <path d="M12 19l-7-7 7-7" />
            </svg>
      </a>

      <div id="shorts-container" class="snap-container no-scrollbar">
      </div>

      <script type="module" src="../../js/vevo/shorts-engine.js"></script>
</body>

</html>
