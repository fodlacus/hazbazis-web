<!DOCTYPE html>
<html lang="hu">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <title>Házbázis Shorts</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <style>
            body {
                  margin: 0;
                  padding: 0;
                  background-color: #000;
                  font-family: sans-serif;
                  overflow: hidden;
                  height: 100dvh;
            }

            /* A GÖRGETŐ KONTÉNER - Scroll Snap aktív */
            .video-feed {
                  height: 100dvh;
                  width: 100%;
                  overflow-y: scroll;
                  scroll-snap-type: y mandatory;
                  scroll-behavior: smooth;
                  -ms-overflow-style: none;
                  scrollbar-width: none;
            }

            .video-feed::-webkit-scrollbar {
                  display: none;
            }

            /* EGY VIDEÓ PANEL */
            .video-container {
                  position: relative;
                  height: 100dvh;
                  width: 100%;
                  scroll-snap-align: start;
                  scroll-snap-stop: always;
                  background: #000;
                  display: flex;
                  justify-content: center;
                  align-items: center;
            }

            video,
            .video-placeholder {
                  height: 100%;
                  width: 100%;
                  object-fit: cover;
                  max-width: 500px;
            }

            /* OVERLAY - Adatok a videón */
            .video-overlay {
                  position: absolute;
                  bottom: 0;
                  left: 50%;
                  transform: translateX(-50%);
                  width: 100%;
                  max-width: 500px;
                  height: 100%;
                  pointer-events: none;
                  display: flex;
                  flex-direction: column;
                  justify-content: flex-end;
                  padding: 20px;
                  padding-bottom: 60px;
                  background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, transparent 50%);
                  z-index: 10;
            }

            .video-info {
                  pointer-events: auto;
                  color: white;
            }

            .brand-badge {
                  background: #E2F1B0;
                  color: #3D4A16;
                  padding: 4px 10px;
                  border-radius: 6px;
                  font-size: 0.7rem;
                  font-weight: 800;
                  display: inline-block;
                  margin-bottom: 8px;
                  text-transform: uppercase;
            }

            /* FIX GOMBOK (Oldalt) */
            .side-controls {
                  position: absolute;
                  right: 15px;
                  bottom: 100px;
                  display: flex;
                  flex-direction: column;
                  gap: 18px;
                  z-index: 100;
            }

            .control-btn {
                  width: 48px;
                  height: 48px;
                  border-radius: 50%;
                  background: rgba(255, 255, 255, 0.15);
                  backdrop-filter: blur(10px);
                  border: 1px solid rgba(255, 255, 255, 0.2);
                  color: white;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  cursor: pointer;
                  transition: 0.2s;
            }

            .control-btn:active {
                  transform: scale(0.9);
                  background: #E2F1B0;
                  color: #000;
            }

            /* MODAL ANIMÁCIÓ */
            #filter-modal.active {
                  display: flex;
            }

            #filter-modal.active #filter-content {
                  transform: translateY(0);
            }
      </style>
</head>

<body>

      <div class="video-feed" id="main-feed"></div>

      <div class="side-controls">
            <button class="control-btn" id="btn-discovery">🔍</button>
            <button class="control-btn" onclick="window.location.reload()">🔄</button>
            <button class="control-btn" onclick="window.location.href='/index.html'">🏠</button>
      </div>

      <div id="filter-modal"
            class="fixed inset-0 bg-black/90 z-[200] hidden flex-col justify-end items-center backdrop-blur-md">
            <div id="filter-content"
                  class="bg-[#121212] w-full max-w-lg rounded-t-3xl p-6 border-t border-white/10 transition-transform duration-300 translate-y-full flex flex-col max-h-[90vh]">
                  <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold text-white">Felfedezés 🌍</h3>
                        <button id="close-modal" class="text-white text-2xl p-2">✕</button>
                  </div>

                  <div id="discovery-grid" class="grid grid-cols-2 gap-3 overflow-y-auto mb-4 pr-2">
                  </div>

                  <button id="btn-trash"
                        class="w-full py-3 rounded-xl border border-white/20 text-white font-bold bg-white/5 hover:bg-white/10 transition">
                        🔄 Szűrők törlése
                  </button>
            </div>
      </div>

      <script type="module" src="/src/js/vevo/shorts-engine.js"></script>

      <script>
            const modal = document.getElementById('filter-modal');
            const openBtn = document.getElementById('btn-discovery');
            const closeBtn = document.getElementById('close-modal');

            const toggleFilter = (show) => {
                  if (show) {
                        modal.classList.remove('hidden');
                        setTimeout(() => modal.classList.add('active'), 10);
                  } else {
                        modal.classList.remove('active');
                        setTimeout(() => modal.classList.add('hidden'), 300);
                  }
            };

            openBtn.addEventListener('click', () => toggleFilter(true));
            closeBtn.addEventListener('click', () => toggleFilter(false));
      </script>
</body>

</html>
