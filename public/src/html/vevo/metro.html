<div id="metro-panel"
      class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
      <div
            class="bg-[#1a1a1a] w-full max-w-2xl rounded-3xl border border-white/10 overflow-hidden flex flex-col max-h-[90vh]">

            <div class="p-6 border-b border-white/10 flex justify-between items-center">
                  <h3 class="text-xl font-bold text-white flex items-center gap-2">
                        <span class="p-2 bg-lime-400/20 rounded-lg text-lime-400">🚇</span>
                        Metró közeli ingatlanok
                  </h3>
                  <button onclick="closeMetroPanel()" class="text-white/40 hover:text-white text-2xl">&times;</button>
            </div>

            <div class="flex p-4 gap-2 bg-black/20 overflow-x-auto">
                  <button onclick="filterMetroList('M1')"
                        class="px-4 py-2 rounded-full border border-yellow-500/50 text-yellow-500 font-bold text-xs hover:bg-yellow-500/10">M1</button>
                  <button onclick="filterMetroList('M2')"
                        class="px-4 py-2 rounded-full border border-red-500/50 text-red-500 font-bold text-xs hover:bg-red-500/10">M2</button>
                  <button onclick="filterMetroList('M3')"
                        class="px-4 py-2 rounded-full border border-blue-500/50 text-blue-500 font-bold text-xs hover:bg-blue-500/10">M3</button>
                  <button onclick="filterMetroList('M4')"
                        class="px-4 py-2 rounded-full border border-green-500/50 text-green-500 font-bold text-xs hover:bg-green-500/10">M4</button>
                  <button onclick="filterMetroList('all')"
                        class="px-4 py-2 rounded-full border border-white/20 text-white text-xs hover:bg-white/5 ml-auto">Összes</button>
            </div>

            <div id="metro-stations-list" class="flex-1 overflow-y-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-2">
            </div>

            <div class="p-6 border-t border-white/10 bg-black/40 flex flex-col sm:flex-row gap-4">
                  <div class="flex-1 text-sm text-white/50 flex items-center" id="selected-count">
                        0 megálló kijelölve
                  </div>
                  <div class="flex gap-2">
                        <button onclick="resetMetroSelection()"
                              class="px-6 py-3 rounded-xl border border-white/10 text-white font-bold hover:bg-white/5 transition-all">Törlés</button>
                        <button id="apply-metro-filter" onclick="applyMetroFilter()"
                              class="px-8 py-3 rounded-xl bg-lime-400 text-black font-bold hover:scale-105 transition-all shadow-lg shadow-lime-400/20">
                              Ingatlanok mutatása
                        </button>

                  </div>
            </div>
      </div>
</div>
<script type="module">
      // Importáljuk a funkciókat a scriptedből
      import { openMetroPanel, applyMetroFilter } from './metro-script.js';

      // Globálissá tesszük őket, hogy a HTML onClicks lássák
      window.openMetroPanel = openMetroPanel;
      window.applyMetroFilter = applyMetroFilter;

      // A hiányzó segédfunkciókat is definiáljuk
      window.closeMetroPanel = () => {
            document.getElementById('metro-panel').classList.add('hidden');
      };

      window.resetMetroSelection = () => {
            const checkboxes = document.querySelectorAll('.metro-checkbox');
            checkboxes.forEach(cb => cb.checked = false);
            document.getElementById('selected-count').innerText = "0 megálló kijelölve";
      };

      window.filterMetroList = (vonal) => {
            // Ez a függvény a metro-script.js-ben lévő renderelőt hívja
            if (typeof window.renderMetroStations === 'function') {
                  window.renderMetroStations(vonal);
            }
      };
</script>
