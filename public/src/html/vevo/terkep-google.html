<!DOCTYPE html>
<html lang="hu">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Hazbázis - Okos Térkép</title>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
      <style>
            /* Térkép konténer, ami kitölti a képernyőt */
            #terkep_tarolo {
                  height: 100vh;
                  width: 100%;
            }

            /* --- KÖZÖS VEZÉRLŐ STÍLUS --- */
            .map-vezerlo {
                  position: absolute;
                  top: 10px;
                  /* Hogy ne takarja ki a Google gombjait */
                  z-index: 5;
                  /* Hogy a térkép fölött legyen */
                  background-color: #3D4A16;
                  border-radius: 2px;
                  border: 1px solid rgba(226, 241, 176, 0.4);
                  box-shadow: rgba(0, 0, 0, 0.4) 0px 2px 8px -2px;
                  cursor: pointer;
                  margin-left: 10px;
                  padding: 0;
            }

            .map-vezerlo-gomb {
                  color: #E2F1B0;
                  font-family: Roboto, Arial, sans-serif;
                  font-size: 14px;
                  font-weight: 500;
                  padding: 8px 12px;
                  background-color: transparent;
                  border: none;
                  display: flex;
                  align-items: center;
                  gap: 8px;
                  text-decoration: none;
            }

            .map-vezerlo-gomb:hover {
                  background-color: rgba(226, 241, 176, 0.15);
            }

            /* --- GOMB POZÍCÓK --- */
            #vissza-gomb-tarolo {
                  left: 10px;
            }

            #torles-vezerlo-tarolo {
                  right: 10px;
            }

            /* Google kijelölés (drawing) gombok egységesítése */
            .gm-style .gm-control-active,
            .gm-style .gm-control-active:focus,
            .gm-style .gm-control-active:hover {
                  background-color: #3D4A16 !important;
                  border: 1px solid rgba(226, 241, 176, 0.4) !important;
                  box-shadow: rgba(0, 0, 0, 0.4) 0px 2px 8px -2px !important;
            }

            .gm-style .gm-control-active img {
                  filter: brightness(0) saturate(100%) invert(88%) sepia(11%) saturate(588%) hue-rotate(12deg) brightness(99%) contrast(91%);
            }
      </style>
</head>

<body>

      <div id="terkep_tarolo"></div>

      <div id="vissza-gomb-tarolo" class="map-vezerlo">
            <a href="/" id="vissza-gomb" class="map-vezerlo-gomb" title="Vissza a főoldalra">
                  <i class="fa-solid fa-arrow-left"></i> Vissza
            </a>
      </div>

      <div id="torles-vezerlo-tarolo" class="map-vezerlo">
            <button id="torles-gomb" class="map-vezerlo-gomb" title="Jelenlegi rajz törlése">
                  <i class="fa-solid fa-trash-can"></i> Törlés
            </button>
      </div>

      <script>
            window.terkep_alap_inditasa = function () {
                  import("../../js/vevo/terkep-google-engine.js")
                        .then((mod) => {
                              if (mod && typeof mod.terkep_alap_inditasa === "function") {
                                    mod.terkep_alap_inditasa();
                              } else if (typeof window.__terkep_alap_inditasa === "function") {
                                    window.__terkep_alap_inditasa();
                              } else {
                                    console.error("Térkép indítás funkció nem található.");
                              }
                        })
                        .catch((err) => console.error("Térkép modul betöltési hiba:", err));
            };
      </script>

      <script src="https://unpkg.com/@googlemaps/markerclusterer@2.6.2/dist/index.umd.min.js"></script>
      <script
            src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCohNOyA4S3XEayQTSqdshNkPxisNdoc90&libraries=drawing,geometry&callback=terkep_alap_inditasa"
            async defer></script>

</body>

</html>
