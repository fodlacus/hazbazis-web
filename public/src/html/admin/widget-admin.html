<!DOCTYPE html>
<html lang="hu">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Widget Kezelő - Hazbazis.hu</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-[#1a1a1a] text-white min-h-screen font-sans">
      <div class="max-w-6xl mx-auto px-6 py-12">
            <div class="flex items-center justify-between mb-10">
                  <div>
                        <h1 class="text-3xl font-bold text-[#E2F1B0]">Widget Kezelő</h1>
                        <p class="text-white/50 text-sm mt-1">Partner widget beállítások és embed kód.</p>
                  </div>
                  <div class="flex items-center gap-3">
                        <a href="admin-hub.html"
                              class="px-4 py-2 rounded-full border border-white/20 text-white/70 hover:text-white hover:bg-white/5 transition text-sm flex items-center gap-2">
                              <i class="fa-solid fa-arrow-left"></i> Vissza
                        </a>
                        <button id="logout-btn"
                              class="px-4 py-2 rounded-full border border-white/20 text-white/70 hover:text-white hover:bg-white/5 transition text-sm flex items-center gap-2">
                              <i class="fa-solid fa-right-from-bracket"></i> Kijelentkezés
                        </button>
                  </div>
            </div>

            <div class="bg-[#222] border border-white/10 rounded-2xl p-6 mb-10">
                  <h2 class="text-lg font-bold mb-4">Új partner hozzáadása</h2>
                  <form id="widget-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                              <label class="block text-xs text-white/60 mb-1 uppercase tracking-wider">Widget HB
                                    azonosító</label>
                              <input id="hb-azon" type="text" placeholder="hb-1769..."
                                    class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white focus:border-[#E2F1B0] outline-none">
                        </div>
                        <div>
                              <label class="block text-xs text-white/60 mb-1 uppercase tracking-wider">Hirdető HB
                                    azonosító</label>
                              <input id="hirdeto-azon" type="text" placeholder="hb-1769..."
                                    class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white focus:border-[#E2F1B0] outline-none">
                        </div>
                        <div>
                              <label class="block text-xs text-white/60 mb-1 uppercase tracking-wider">Partner
                                    név</label>
                              <input id="partner-nev" type="text" placeholder="Cég neve"
                                    class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white focus:border-[#E2F1B0] outline-none">
                        </div>
                        <div>
                              <label class="block text-xs text-white/60 mb-1 uppercase tracking-wider">Domain
                                    (opcionális)</label>
                              <input id="partner-domain" type="text" placeholder="ceg.hu"
                                    class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white focus:border-[#E2F1B0] outline-none">
                        </div>
                        <div class="md:col-span-2 flex items-center justify-between gap-4">
                              <label class="inline-flex items-center gap-2 text-sm text-white/70">
                                    <input id="partner-active" type="checkbox"
                                          class="rounded bg-black/50 border-white/20 text-[#E2F1B0]">
                                    Aktív
                              </label>
                              <button type="submit"
                                    class="bg-[#E2F1B0] hover:bg-[#cde088] text-[#3D4A16] font-bold px-6 py-3 rounded-xl transition shadow-lg">
                                    Mentés
                              </button>
                        </div>
                  </form>
            </div>

            <div class="bg-[#222] border border-white/10 rounded-2xl p-6">
                  <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-bold">Partnerek</h2>
                        <button id="frissites-btn"
                              class="text-white/60 hover:text-white text-sm flex items-center gap-2">
                              <i class="fa-solid fa-rotate"></i> Frissítés
                        </button>
                  </div>
                  <div id="widget-lista" class="space-y-4"></div>
            </div>
      </div>

      <script type="module" src="../../js/admin/widget-admin.js"></script>

</body>

</html>
