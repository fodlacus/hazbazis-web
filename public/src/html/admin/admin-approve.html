<!DOCTYPE html>
<html lang="hu">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Hirdetés Jóváhagyás - Admin</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-[#1a1a1a] text-white min-h-screen font-sans">

      <nav class="border-b border-white/10 bg-black/20 backdrop-blur-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                  <div class="flex items-center gap-4">
                        <a href="admin-hub.html" class="text-white/60 hover:text-white transition"><i
                                    class="fa-solid fa-arrow-left"></i> Vissza</a>
                        <h1 class="text-xl font-bold text-[#E2F1B0]">Jóváhagyásra váró hirdetések</h1>
                  </div>
                  <button onclick="betoltes()"
                        class="text-sm bg-white/10 hover:bg-white/20 px-3 py-1 rounded transition">
                        <i class="fa-solid fa-rotate"></i> Frissítés
                  </button>
            </div>
      </nav>

      <div class="max-w-4xl mx-auto p-6">

            <div id="lista-kontener" class="space-y-4">
                  <p class="text-center text-white/40 py-10">Adatok betöltése...</p>
            </div>

      </div>

      <script type="module">
            import { adatbazis, auth } from "../../js/util/firebase-config.js";
            import { collection, getDocs, getDoc, setDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
            import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

            onAuthStateChanged(auth, (user) => { if (!user) window.location.href = '/index.html'; else betoltes(); });

            window.betoltes = async function () {
                  const kontener = document.getElementById("lista-kontener");
                  kontener.innerHTML = '<div class="text-center py-8"><i class="fa-solid fa-spinner fa-spin text-2xl text-[#E2F1B0]"></i></div>';

                  try {
                        const snapshot = await getDocs(collection(adatbazis, "hirdetesek_varolista"));
                        kontener.innerHTML = snapshot.empty ? '<p class="text-center text-white/50">Nincs hirdetés.</p>' : "";

                        for (const docSnap of snapshot.docs) {
                              const data = docSnap.data();
                              let userEmail = "Betöltés...";
                              // (Itt maradhat az email lekérdezés logikád, vagy használd a data.email-t ha már van)
                              userEmail = data.email || data.hirdeto_uid;

                              const kartya = document.createElement("div");
                              kartya.className = "bg-[#2a2a2a] border border-white/10 rounded-xl p-6 mb-4 shadow-lg flex flex-col md:flex-row gap-6";

                              // --- IDŐTARTAM VÁLASZTÓ ---
                              const selectId = `duration-${docSnap.id}`;

                              kartya.innerHTML = `
                            <div class="flex-1">
                                <span class="text-yellow-400 text-xs font-bold bg-yellow-400/10 px-2 py-1 rounded">${data.azon}</span>
                                <h3 class="text-xl font-bold text-white mt-2">${data.telepules}, ${data.utca || ''}</h3>
                                <p class="text-[#E2F1B0] text-lg font-bold">${Number(data.ar || data.vételár).toLocaleString()} Ft</p>
                                <p class="text-white/60 text-sm mt-2">📧 ${userEmail}</p>
                            </div>
    
                            <div class="flex flex-col gap-3 min-w-[200px]">
                                <label class="text-xs text-white/50 uppercase">Érvényesség ideje:</label>
                                <select id="${selectId}" class="bg-black/40 border border-white/20 text-white p-2 rounded text-sm focus:border-[#E2F1B0] outline-none">
                                    <option value="30">30 Nap</option>
                                    <option value="60">60 Nap</option>
                                    <option value="90">90 Nap</option>
                                    <option value="365">1 Év</option>
                                </select>
    
                                <button onclick="approve('${docSnap.id}')" class="bg-[#E2F1B0] hover:bg-[#cde088] text-[#3D4A16] font-bold py-3 px-4 rounded transition flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-check"></i> ÉLESÍTÉS
                                </button>
                                <button onclick="reject('${docSnap.id}')" class="bg-white/5 hover:bg-red-500/20 text-red-400 py-2 px-4 rounded transition text-sm">
                                    <i class="fa-solid fa-trash"></i> Elutasítás
                                </button>
                            </div>
                        `;
                              kontener.appendChild(kartya);
                        }
                  } catch (err) { console.error(err); }
            };

            window.approve = async function (id) {
                  if (!confirm("Publikálod a hirdetést?")) return;

                  try {
                        // 1. NAPOK LEKÉRÉSE A SELECTBŐL
                        const napok = parseInt(document.getElementById(`duration-${id}`).value);

                        // 2. DÁTUM SZÁMÍTÁS
                        const most = new Date();
                        const lejarat = new Date();
                        lejarat.setDate(most.getDate() + napok);

                        // 3. ADATOK MOZGATÁSA
                        const sourceRef = doc(adatbazis, "hirdetesek_varolista", id);
                        const sourceSnap = await getDoc(sourceRef);
                        const rawData = sourceSnap.data();

                        const cleanData = {
                              ...rawData,
                              ar: rawData.vételár || rawData.ar,
                              alapterulet: rawData.alapterület || rawData.alapterulet,
                              szobaszam: rawData.szobák || rawData.szobak || rawData.szobaszam,
                              szobak: rawData.szobák || rawData.szobak,

                              statusz: "Aktiv",
                              aktivalas_ideje: most.toISOString(),
                              lejarat_datum: lejarat.toISOString(), // <-- EZ AZ ÚJ ADAT!
                              ervenyesseg_nap: napok
                        };

                        await setDoc(doc(adatbazis, "lakasok", id), cleanData);
                        await deleteDoc(sourceRef);

                        alert(`Sikeres! A hirdetés ${napok} napig aktív (Lejárat: ${lejarat.toLocaleDateString()}).`);
                        betoltes();

                  } catch (err) { console.error(err); alert("Hiba: " + err.message); }
            };

            window.reject = async function (id) { /* ... (marad a régi) ... */
                  if (!confirm("Törlöd?")) return;
                  await deleteDoc(doc(adatbazis, "hirdetesek_varolista", id));
                  betoltes();
            };
      </script>

</body>

</html>
