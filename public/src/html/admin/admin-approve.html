<!DOCTYPE html>
<html lang="hu">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Hirdetés Jóváhagyás - Admin</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-[#1a1a1a] text-white min-h-screen font-sans">

      <nav class="border-b border-white/10 bg-black/20 backdrop-blur-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                  <div class="flex items-center gap-4">
                        <a href="admin-hub.html" class="text-white/60 hover:text-white transition"><i
                                    class="fa-solid fa-arrow-left"></i> Vissza</a>
                        <h1 class="text-xl font-bold text-[#E2F1B0]">Jóváhagyásra váró hirdetések</h1>
                  </div>
                  <button onclick="betoltes()"
                        class="text-sm bg-white/10 hover:bg-white/20 px-3 py-1 rounded transition">
                        <i class="fa-solid fa-rotate"></i> Frissítés
                  </button>
            </div>
      </nav>

      <div class="max-w-4xl mx-auto p-6">

            <div id="lista-kontener" class="space-y-4">
                  <p class="text-center text-white/40 py-10">Adatok betöltése...</p>
            </div>

      </div>

      <script type="module">
            import { adatbazis, auth } from "../../js/util/firebase-config.js";
            import {
                  collection, getDocs, getDoc, setDoc, doc, deleteDoc
            } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
            import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

            // Biztonsági ellenőrzés
            onAuthStateChanged(auth, (user) => {
                  if (!user) window.location.href = '/index.html';
                  else betoltes();
            });

            // 1. LISTÁZÁS
            window.betoltes = async function () {
                  const kontener = document.getElementById("lista-kontener");
                  kontener.innerHTML = '<div class="text-center py-8"><i class="fa-solid fa-spinner fa-spin text-2xl text-[#E2F1B0]"></i></div>';

                  try {
                        const snapshot = await getDocs(collection(adatbazis, "hirdetesek_varolista"));

                        if (snapshot.empty) {
                              kontener.innerHTML = `
                            <div class="text-center py-10 bg-white/5 rounded-2xl border border-white/10">
                                <i class="fa-regular fa-folder-open text-4xl text-white/20 mb-3"></i>
                                <p class="text-white/60">Jelenleg nincs függőben lévő hirdetés.</p>
                            </div>`;
                              return;
                        }

                        kontener.innerHTML = ""; // Ürítés

                        snapshot.forEach(docSnap => {
                              const data = docSnap.data();

                              // --- ADATMEZŐK JAVÍTÁSA (Ékezetes vs Ékezet nélküli) ---
                              // Itt kezeljük le, hogy mi van az adatbázisban
                              const ar = data.vételár || data.ar || 0;
                              const terulet = data.alapterület || data.alapterulet || 0;
                              const szobak = data.szobák || data.szobak || 0;
                              const hirdetoNev = data.nev || "Ismeretlen hirdető";
                              const utca = data.utca || 'Nincs megadva';
                              const varosresz = data.varosresz ? `(${data.varosresz})` : '';

                              const kartya = document.createElement("div");
                              kartya.className = "bg-[#2a2a2a] border border-white/10 rounded-xl p-6 hover:border-[#E2F1B0]/50 transition flex flex-col md:flex-row justify-between gap-6 shadow-lg";

                              kartya.innerHTML = `
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="bg-yellow-500/20 text-yellow-400 text-xs px-2 py-1 rounded font-bold">${data.azon}</span>
                                    <span class="text-white/40 text-xs"><i class="fa-regular fa-clock"></i> ${new Date(data.letrehozva).toLocaleDateString()}</span>
                                </div>
                                <h3 class="text-xl font-bold text-white">${data.telepules}, ${utca} ${varosresz}</h3>
                                <p class="text-[#E2F1B0] font-bold text-lg mb-2">${Number(ar).toLocaleString()} Ft</p>
                                
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm text-white/70 bg-black/20 p-3 rounded-lg">
                                    <p>👤 ${hirdetoNev}</p>
                                    <p>📧 ${data.email || 'Nincs adat'}</p>
                                    <p>📐 ${terulet} m²</p>
                                    <p>🛏️ ${szobak} szoba</p>
                                </div>
                            </div>
    
                            <div class="flex flex-col justify-center gap-3 border-t md:border-t-0 md:border-l border-white/10 pt-4 md:pt-0 md:pl-6 min-w-[160px]">
                                <button onclick="approve('${docSnap.id}')" class="bg-[#E2F1B0] hover:bg-[#cde088] text-[#3D4A16] font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition">
                                    <i class="fa-solid fa-check"></i> ÉLESÍTÉS
                                </button>
                                <button onclick="reject('${docSnap.id}')" class="bg-white/5 hover:bg-red-500/20 text-red-400 hover:text-red-300 font-medium py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition border border-transparent hover:border-red-500/30">
                                    <i class="fa-solid fa-trash"></i> Elutasítás
                                </button>
                            </div>
                        `;
                              kontener.appendChild(kartya);
                        });

                  } catch (err) {
                        console.error(err);
                        kontener.innerHTML = `<p class="text-red-400 text-center">Hiba: ${err.message}</p>`;
                  }
            };

            // 2. JÓVÁHAGYÁS (Átmozgatás és mezőnevek egységesítése)
            window.approve = async function (id) {
                  if (!confirm("Biztosan publikálod ezt a hirdetést? Innentől látható lesz a rendszerben.")) return;

                  try {
                        // A. Olvasás
                        const sourceRef = doc(adatbazis, "hirdetesek_varolista", id);
                        const sourceSnap = await getDoc(sourceRef);

                        if (!sourceSnap.exists()) { alert("A hirdetés már nem létezik!"); return; }
                        const rawData = sourceSnap.data();

                        // B. ADATTISZTÍTÁS (Ékezetmentesítés a végleges táblához)
                        // Ez fontos, hogy a Shorts/Kereső (amik 'ar'-t és 'szobak'-at keresnek) jól működjenek!
                        const cleanData = {
                              ...rawData,
                              ar: rawData.vételár || rawData.ar,
                              alapterulet: rawData.alapterület || rawData.alapterulet,
                              szobaszam: rawData.szobák || rawData.szobak || rawData.szobaszam, // Figyelj: szobaszam vs szobak
                              szobak: rawData.szobák || rawData.szobak, // Biztonság kedvéért mindkettőt elmentjük
                              statusz: "Aktiv",
                              aktivalas_ideje: new Date().toISOString()
                        };

                        // C. Átírás az ÉLES 'lakasok' táblába
                        await setDoc(doc(adatbazis, "lakasok", id), cleanData);

                        // D. Törlés a várólistából
                        await deleteDoc(sourceRef);

                        alert("✅ Sikeres publikálás!");
                        betoltes();

                  } catch (err) {
                        console.error(err);
                        alert("Hiba: " + err.message);
                  }
            };

            // 3. ELUTASÍTÁS
            window.reject = async function (id) {
                  if (!confirm("VÉGLEG törlöd a hirdetést?")) return;
                  try {
                        await deleteDoc(doc(adatbazis, "hirdetesek_varolista", id));
                        alert("🗑️ Hirdetés törölve.");
                        betoltes();
                  } catch (err) {
                        console.error(err);
                        alert("Hiba törléskor.");
                  }
            };
      </script>


</body>

</html>
