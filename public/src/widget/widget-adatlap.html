<!DOCTYPE html>
<html lang="hu">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Ingatlan Adatlap</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
      <style>
            body {
                  background-color: #111;
                  color: white;
            }

            .btn-hover:hover {
                  transform: translateY(-2px);
                  box-shadow: 0 4px 12px rgba(226, 241, 176, 0.3);
            }
      </style>
</head>

<body class="min-h-screen flex flex-col items-center py-8 px-4">

      <div class="max-w-3xl w-full flex justify-between items-center mb-6">
            <div class="text-[#E2F1B0] font-bold text-lg tracking-wider">HAZBAZIS.HU</div>
            <button onclick="window.close()"
                  class="text-white/50 hover:text-white text-sm flex items-center gap-2 transition">
                  <i class="fa-solid fa-xmark"></i> Bezárás
            </button>
      </div>

      <div id="loading" class="text-center py-20 text-white/50">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-4"></i><br>Adatok betöltése...
      </div>

      <div id="content"
            class="max-w-3xl w-full bg-[#1a1a1a] rounded-2xl border border-white/10 overflow-hidden shadow-2xl hidden">

            <div class="relative h-64 md:h-96 w-full bg-black">
                  <img id="main-image" src="" class="w-full h-full object-cover opacity-90">
                  <div
                        class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-[#1a1a1a] via-[#1a1a1a]/80 to-transparent pt-20 p-6">
                        <div class="flex justify-between items-end">
                              <div>
                                    <span id="hb-badge"
                                          class="bg-[#E2F1B0] text-[#3D4A16] px-2 py-0.5 rounded text-xs font-bold mb-2 inline-block shadow-lg"></span>
                                    <h1 id="price"
                                          class="text-3xl md:text-4xl font-bold text-white mb-1 drop-shadow-md"></h1>
                                    <p id="address" class="text-white/80 text-lg flex items-center gap-2"><i
                                                class="fa-solid fa-location-dot text-red-500"></i> <span></span></p>
                              </div>

                              <a id="tour-btn" href="#" target="_blank"
                                    class="hidden bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-5 rounded-xl shadow-lg btn-hover flex items-center gap-2 transition border border-white/10">
                                    <i class="fa-solid fa-street-view text-xl"></i>
                                    <span class="hidden md:inline">Virtuális Séta</span>
                              </a>
                        </div>
                  </div>
            </div>

            <div class="p-6 md:p-8">
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 border-b border-white/10 pb-8">
                        <div class="bg-white/5 p-3 rounded-lg text-center border border-white/5">
                              <i class="fa-solid fa-vector-square text-[#E2F1B0] mb-2 text-xl"></i>
                              <div id="size" class="font-bold text-lg"></div>
                              <div class="text-xs text-white/50 uppercase">Alapterület</div>
                        </div>
                        <div class="bg-white/5 p-3 rounded-lg text-center border border-white/5">
                              <i class="fa-solid fa-door-open text-[#E2F1B0] mb-2 text-xl"></i>
                              <div id="rooms" class="font-bold text-lg"></div>
                              <div class="text-xs text-white/50 uppercase">Szobák</div>
                        </div>
                        <div class="bg-white/5 p-3 rounded-lg text-center border border-white/5">
                              <i class="fa-solid fa-layer-group text-[#E2F1B0] mb-2 text-xl"></i>
                              <div id="floor" class="font-bold text-lg"></div>
                              <div class="text-xs text-white/50 uppercase">Emelet</div>
                        </div>
                        <div class="bg-white/5 p-3 rounded-lg text-center border border-white/5">
                              <i class="fa-solid fa-building text-[#E2F1B0] mb-2 text-xl"></i>
                              <div id="type" class="font-bold text-lg"></div>
                              <div class="text-xs text-white/50 uppercase">Típus</div>
                        </div>
                  </div>

                  <h2 class="text-xl font-bold text-[#E2F1B0] mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-align-left"></i> Leírás
                  </h2>
                  <div id="description"
                        class="text-gray-300 leading-relaxed text-sm whitespace-pre-line mb-8 font-light"></div>

                  <div
                        class="bg-gradient-to-r from-[#E2F1B0]/10 to-transparent border border-[#E2F1B0]/20 p-6 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4">
                        <div>
                              <div class="text-[#E2F1B0] font-bold text-lg mb-1">Felkeltettük érdeklődését?</div>
                              <div class="text-white/60 text-sm">Hivatkozzon a fenti azonosítóra kapcsolatfelvételkor.
                              </div>
                        </div>
                        <a href="https://hazbazis.hu" target="_blank"
                              class="bg-[#E2F1B0] text-[#3D4A16] font-bold px-6 py-3 rounded-xl text-sm hover:bg-[#d4e69e] transition btn-hover shadow-lg flex items-center gap-2">
                              <i class="fa-solid fa-phone"></i> Kapcsolatfelvétel
                        </a>
                  </div>
            </div>

      </div>

      <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
            import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

            // ---  FB KONFIGURÁCIÓ  ---
            const firebaseConfig = {
                  apiKey: "AIzaSyCohNOyA4S3XEayQTSqdshNkPxisNdoc90",
                  authDomain: "hazbazis.firebaseapp.com",
                  projectId: "hazbazis",
                  storageBucket: "hazbazis.firebasestorage.app",
                  messagingSenderId: "228035570741",
                  appId: "1:228035570741:web:58827ab31ede50f1f6157c",
            };
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            const getUrl = (item) => {
                  if (!item) return null;
                  return typeof item === 'object' ? item.url : item;
            };

            async function loadAdatlap() {
                  if (!id) return;
                  try {
                        const docRef = doc(db, "lakasok", id);
                        const docSnap = await getDoc(docRef);

                        if (docSnap.exists()) {
                              const data = docSnap.data();

                              // 1. KÉP HIBAJAVÍTÁS: kepek_horiz prioritása
                              let mainImageUrl = "";

                              // a) Vízszintes képek
                              if (data.kepek_horiz && data.kepek_horiz.length > 0) {
                                    mainImageUrl = getUrl(data.kepek_horiz[0]);
                              }
                              // b) Borítókép
                              if (!mainImageUrl && data.boritokep) {
                                    mainImageUrl = getUrl(data.boritokep);
                              }
                              // c) Sima képek
                              if (!mainImageUrl && data.kepek && data.kepek.length > 0) {
                                    mainImageUrl = getUrl(data.kepek[0]);
                              }
                              // d) Placeholder
                              if (!mainImageUrl) mainImageUrl = "https://placehold.co/800x600?text=Nincs+kép";

                              document.getElementById('main-image').src = mainImageUrl;

                              // 2. ADATOK HIBAJAVÍTÁSA: Ékezetes mezők
                              document.getElementById('hb-badge').innerText = data.azon || id;
                              document.getElementById('price').innerText = Number(data.ar || data.vételár).toLocaleString() + " Ft";
                              document.getElementById('address').querySelector('span').innerText = `${data.telepules}, ${data.utca || data.varosresz || ''}`;

                              document.getElementById('size').innerText = (data.alapterület || data.alapterulet) + " m²";
                              document.getElementById('rooms').innerText = (data.szobák || data.szobak || '?');
                              document.getElementById('floor').innerText = data.emelet || '-';
                              document.getElementById('type').innerText = data.tipus || 'Lakás';

                              // JAVÍTVA: Leírás ékezetes mező ellenőrzése
                              const leirasSzoveg = data.leiras || data['leírás'] || "Nincs leírás megadva.";
                              document.getElementById('description').innerText = leirasSzoveg;

                              // 3. VIRTUÁLIS TÚRA LOGIKA 
                              let tourUrl = null;
                              if (data.virtual_tour || data.virtual_tur) {

                                    // Nem a főoldalra küldjük, hanem a widget-tour.html-re!
                                    tourUrl = `widget-tour.html?id=${id}`;
                              }

                              if (tourUrl) {
                                    const tourBtn = document.getElementById('tour-btn');

                                    tourBtn.href = tourUrl;
                                    tourBtn.target = "_self";

                                    tourBtn.classList.remove('hidden');
                                    tourBtn.classList.add('flex');
                              }

                              document.getElementById('loading').classList.add('hidden');
                              document.getElementById('content').classList.remove('hidden');
                        }
                  } catch (error) {
                        console.error(error);
                        document.getElementById('loading').innerHTML = "Hiba történt.";
                  }
            }
            loadAdatlap();
      </script>
</body>

</html>
