<!DOCTYPE html>
<html lang="hu">

<head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>RoadScan terkep</title>
      <link rel="stylesheet" href="css/style.css" />
      <script src="https://cdn.tailwindcss.com"></script>
      <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
      <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
      <script src="js/firebase-config.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.3/jspdf.plugin.autotable.min.js"></script>
      <script src="js/map.js" defer></script>
      <style>
            /* ACCORDION */
            .accordion-blokk {
                  border-bottom: 1px solid #dcdcdc;
            }

            /* TAB FEJ */
            .accordion-fejlec {
                  width: 100%;
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  background: #e9e9e9;
                  border: none;
                  font-weight: 600;
                  font-size: 15px;
                  padding: 12px 12px;
                  cursor: pointer;
                  transition: background .15s;
            }

            /* hover */
            .accordion-fejlec:hover {
                  background: #e1e1e1;
            }

            /* nyitott állapot */
            .accordion-blokk.nyitva .accordion-fejlec {
                  background: #dddddd;
            }

            /* nyíl */
            .accordion-nyil {
                  font-size: 12px;
                  transition: transform .2s;
            }

            .accordion-blokk.nyitva .accordion-nyil {
                  transform: rotate(90deg);
            }

            /* tartalom */
            .accordion-tartalom {
                  max-height: 0;
                  overflow: hidden;
                  transition: max-height .25s ease;
                  background: white;
                  padding: 0 12px;
            }

            .accordion-blokk.nyitva .accordion-tartalom {
                  max-height: 1500px;
                  padding: 12px;
            }
      </style>
</head>

<body class="bg-[#f3f3f3] text-[#3f3f3f]">
      <div class="oldal">
            <header class="fejlec">
                  <div class="fejlec-belso">
                        <div class="logo">RoadScan</div>
                        <select id="temaSelect" class="mezo-select">
                              <option value=""> -- Térkép/típus --</option>
                              <option value="uthibak">Úthibák</option>
                              <option value="jardahibak">Járdahibák</option>
                              <option value="utlezarasok">Útlezárások</option>
                              <option value="tabla_problemak">Szemét lerakatok</option>
                              <option value="helyzetkep">Építkezések</option>
                        </select>
                        <select id="onkoriSelect" class="mezo-select">
                              <option value="">-- Önkormányzat --</option>
                              <option value="bp17">Budapest XVII</option>
                              <option value="bp11">Budapest XI</option>
                              <option value="bp08">Budapest VIII</option>
                              <option value="debr">Debrecen</option>
                              <option value="gyor">Gyor</option>
                        </select>
                        <button id="betoltGomb" class="gomb-barna">Betolt</button>
                        <div id="betoltesAllapot" class="betoltes-allapot"></div>
                  </div>
            </header>
            <div class="tartalom">
                  <aside class="oldalsav">
                        <!-- SZURES -->
                        <div class="accordion-blokk nyitva">
                              <button class="accordion-fejlec">
                                    Szures
                                    <span class="accordion-nyil">▶</span>
                              </button>
                              <div class="accordion-tartalom">
                                    <div class="panel-leiras">
                                          Valaszd ki, mely statuszok jelenjenek meg a terkepen.
                                    </div>
                                    <div class="checkbox-csoport">
                                          <label class="checkbox-sor">
                                                <input type="checkbox" class="statuszCheckbox" value="alacsony"
                                                      checked />
                                                <span class="pont zold"></span>
                                                <span>Alacsony</span>
                                          </label>
                                          <label class="checkbox-sor">
                                                <input type="checkbox" class="statuszCheckbox" value="kozepes"
                                                      checked />
                                                <span class="pont narancs"></span>
                                                <span>Kozepes</span>
                                          </label>
                                          <label class="checkbox-sor">
                                                <input type="checkbox" class="statuszCheckbox" value="magas" checked />
                                                <span class="pont piros"></span>
                                                <span>Magas</span>
                                          </label>
                                          <label class="checkbox-sor">
                                                <input type="checkbox" class="statuszCheckbox" value="elkeszult"
                                                      checked />
                                                <span class="pont szurke"></span>
                                                <span>Elkeszult</span>
                                          </label>
                                    </div>
                                    <div class="statisztika">
                                          <div class="statisztika-sor">
                                                <span>Osszes rekord:</span>
                                                <strong id="osszDb">0</strong>
                                          </div>
                                          <div class="statisztika-sor">
                                                <span>Lathato rekord:</span>
                                                <strong id="lathatoDb">0</strong>
                                          </div>
                                          <div class="statisztika-sor">
                                                <span>Aktiv onkormanyzat:</span>
                                                <strong id="aktivOnkori">-</strong>
                                          </div>
                                    </div>
                              </div>
                        </div>
                        <!-- KIJEOLES -->
                        <div class="accordion-blokk">
                              <button class="accordion-fejlec">
                                    Kijeloles
                                    <span class="accordion-nyil">▶</span> </button>
                              <div class="accordion-tartalom">
                                    <div class="muvelet-gombok">
                                          <button id="rajzolasInditGomb" class="gomb-barna gomb-kicsi">
                                                Polygon rajzolas
                                          </button>
                                          <button id="polygonTorolGomb" class="gomb-szurke gomb-kicsi">
                                                Polygon torles
                                          </button>
                                    </div>
                                    <div class="kijelolt-osszefoglalo">
                                          <div class="statisztika-sor">
                                                <span>Kijelolt hibak:</span>
                                                <strong id="kijeloltDb">0</strong>
                                          </div>
                                          <div id="kijeloltOsszeg" class="statisztika-osszeg"></div>
                                    </div>
                                    <div id="kijeloltLista" class="kijelolt-lista">
                                          <div class="ures-lista">Nincs kijelolt elem.</div>
                                    </div>
                                    <button id="kosarbaGomb" class="gomb-barna gomb-kicsi">
                                          Hozzaad ajanlati kosarhoz
                                    </button>
                              </div>
                        </div>
                        <!-- KOSAR -->
                        <div class="accordion-blokk">
                              <button class="accordion-fejlec">
                                    Ajanlati kosar
                                    <span class="accordion-nyil">▶</span> </button>
                              <div class="accordion-tartalom">
                                    <div id="becsultOsszeg">
                                          Becsült javítási érték: 0 Ft
                                    </div>
                                    <div class="statisztika-sor">
                                          <span>Elemek szama:</span>
                                          <strong id="kosarDb">0</strong>
                                    </div>
                                    <div id="kosarLista" class="kijelolt-lista">
                                          <div class="ures-lista">
                                                A kosar ures.
                                          </div>
                                    </div>
                                    <div class="muvelet-gombok">
                                          <button id="kosarTorolGomb" class="gomb-szurke gomb-kicsi">
                                                Kosar uritese
                                          </button>
                                    </div>
                              </div>
                              <button id="pdfGeneralGomb" class="gomb-barna gomb-kicsi">
                                    PDF ajanlat generalasa
                              </button>
                        </div>
                  </aside>
                  <main class="terkep-tarto">
                        <div id="map"></div>
                  </main>
            </div>
      </div>
      <script>
            window.initMap = window.initMap || function () { };
      </script>
      <script
            src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC0tA6_CBfkz8NI7Ye-I8w6Xphr_IK-rVY&libraries=drawing,geometry&callback=initMap"
            async defer></script>
      <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>
      <script>
            /* ACCORDION */
            document.querySelectorAll(".accordion-fejlec").forEach(function (fejlec) {
                  fejlec.addEventListener("click", function () {
                        const blokk = this.parentElement
                        blokk.classList.toggle("nyitva")
                  })
            })
      </script>
      <script>
            document.getElementById("pdfGeneralGomb").addEventListener("click", generalPDF)

            function generalPDF() {
                  const { jsPDF } = window.jspdf;
                  const doc = new jsPDF();
                  let y = 20;

                  // Fejléc
                  doc.setFontSize(18);
                  doc.text("RoadScan - Javitas ajanlat", 20, y);
                  y += 10;

                  doc.setFontSize(11);
                  const telepulesElem = document.getElementById("aktivOnkori");
                  const telepules = telepulesElem ? telepulesElem.innerText : "";
                  doc.text("Telepules: " + telepules, 20, y);
                  y += 10;
                  doc.text("Elemek szama: " + document.getElementById("kosarDb").innerText, 20, y);
                  y += 10;
                  doc.text(document.getElementById("becsultOsszeg").innerText, 20, y);
                  y += 15;

                  // Hibák listája táblázat
                  doc.setFontSize(13);
                  doc.text("Hibak listaja", 20, y);
                  y += 6;

                  // Adatok kigyűjtése
                  let rows = [];

                  // Elsőként közvetlenül a JavaScript kosár-adatokat próbáljuk használni,
                  // hogy ne függjünk a DOM szövegstruktúrájától (mobilon másképp tördelhet).
                  if (window.roadscanGetPdfRows) {
                        rows = window.roadscanGetPdfRows();
                  }

                  // Ha valamiért még sincs adat, fallback a DOM‑alapú kinyerésre
                  if (!rows.length) {
                        // Feltételezzük, hogy a kosár tételei (hibák) rekord, azonosító, státusz, méret, javítás stb. mezőkkel rendelkeznek.
                        // Ha az adatstruktúra eltér, ezt ennek megfelelően kell módosítani.
                        const lista = document.querySelectorAll("#kosarLista > div");
                        lista.forEach(function (elem) {
                              // Ha ures-lista, átugorjuk
                              if (elem.classList.contains('ures-lista')) return;

                              // Próbáljuk kinyerni adat attribútumokból, egyébként fallback innerText bányászat
                              let azonosito = elem.getAttribute('data-azonosito') || "";
                              let statusz = elem.getAttribute('data-statusz') || "";
                              let meret = elem.getAttribute('data-meret') || "";
                              let javitas = elem.getAttribute('data-javitas') || "";
                              let telepulesCella = telepules;

                              // Ha nincs data attribútum, próbáld innerText-ből
                              if (!azonosito || !statusz || !meret || !javitas) {
                                    // Példa: Azonosító: XXXX\nStátusz: YYYY\nMéret: ZZZ m2\nBecsült javítás: NNN Ft
                                    const m = elem.innerText
                                          .replace("Torles", "")
                                          .replace(/\s{2,}/g, " ")
                                          .normalize("NFD")
                                          .replace(/[\u0300-\u036f]/g, "")
                                          .split('\n')
                                          .filter(s => s.trim().length > 0);
                                    // Egyszerű szétválasztás:
                                    for (let sor of m) {
                                          if (sor.toLowerCase().includes("azonosito:")) azonosito = sor.split(":")[1]?.trim() || "";
                                          if (sor.toLowerCase().includes("statusz:")) statusz = sor.split(":")[1]?.trim() || "";
                                          if (sor.toLowerCase().includes("meret:")) meret = sor.split(":")[1]?.trim() || "";
                                          if (sor.toLowerCase().includes("javitas") || sor.toLowerCase().includes("becsult")) javitas = sor.split(":")[1]?.trim() || "";
                                    }
                              }

                              // Sorok összegyűjtése, címkéket eltávolítva
                              rows.push([
                                    azonosito,
                                    statusz,
                                    meret,
                                    telepulesCella,
                                    javitas
                              ]);
                        });
                  }

                  // Táblázat fejléc
                  const fejlec = [
                        "Azonosito",
                        "Statusz",
                        "Meret",
                        "Telepules",
                        "Becsult javitas"
                  ];

                  // Táblázat paraméterek, barna fejléccel
                  doc.autoTable({
                        head: [fejlec],
                        body: rows,
                        startY: y,
                        styles: {
                              font: 'helvetica',
                              fontSize: 10,
                        },
                        headStyles: {
                              fillColor: [135, 73, 13], // barna (tailwind: #87490d)
                              textColor: 255,
                              fontStyle: 'bold'
                        },
                        margin: { left: 15, right: 15 },
                        tableLineColor: [101, 55, 13],
                        tableLineWidth: 0.1
                  });

                  doc.save("roadscan_ajanlat.pdf");
            }


      </script>
</body>

</html>
