                  <script>
                        function iranyAKereso() {
                              const bemenet = document.getElementById('main-search-input').value;
                              const url = bemenet.trim() === ""
                                    ? "src/search/search-index.html"
                                    : `src/search/search-index.html?q=${encodeURIComponent(bemenet)}`;
                              window.location.href = url;
                        }

                        function iranyMenu(tipus) {
                              // Átvisszük a 'menu' paramétert (pl. ?menu=metro)
                              window.location.href = `src/search/search-index.html?menu=${tipus}`;
                        }

                        document.getElementById('main-search-input').addEventListener('keypress', (e) => {
                              if (e.key === 'Enter') iranyAKereso();
                        });
                  </script>

      <script type="module" src="src/js/index.js"></script>

      <script type="module">
            // 1. IMPORTÁLÁSOK
            import { initAuthMonitor } from "./src/js/auth/auth-handler.js";
            import { auth } from "./src/js/util/firebase-config.js";
            import { signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

            // 2. ELINDÍTJUK AZ ÚJ JOGOSULTSÁG FIGYELŐT
            // Ez fogja kezelni Bázis Bálint gombját helyesen!
            initAuthMonitor();

            // 3. KILÉPÉS FUNKCIÓ (Hogy a HTML gomb megtalálja)
            window.kilepes = async function () {
                  try {
                        await signOut(auth);
                        window.location.href = "index.html";
                  } catch (error) {
                        console.error("Hiba kilépéskor:", error);
                  }
            }

            // 4. MOBIL MENÜ LOGIKA (Ezt megtartjuk!)
            const gomb = document.getElementById('mobil-menu-gomb');
            const menu = document.getElementById('mobil-menu');
            if (gomb && menu) {
                  gomb.addEventListener('click', (e) => {
                        e.stopPropagation();
                        menu.classList.toggle('hidden');
                  });
                  document.addEventListener('click', (e) => {
                        if (!menu.contains(e.target) && !gomb.contains(e.target)) {
                              menu.classList.add('hidden');
                        }
                  });
            }
            function iranyAKereso() {
                  const bemenet = document.getElementById('main-search-input').value;
                  const url = bemenet.trim() === ""
                        ? "src/search/search-index.html"
                        : `src/search/search-index.html?q=${encodeURIComponent(bemenet)}`;
                  window.location.href = url;
            }

            function iranyMenu(tipus) {
                  // Átvisszük a 'menu' paramétert (pl. ?menu=metro)
                  window.location.href = `src/search/search-index.html?menu=${tipus}`;
            }
            document.getElementById('main-search-input').addEventListener('keypress', (e) => {
                  if (e.key === 'Enter') iranyAKereso();
            });
            // 5. KERESŐ LOGIKA (Ezt is megtartjuk!)
            document.addEventListener('DOMContentLoaded', () => {
                  const searchInput = document.getElementById('landing-search-input'); // Ha van ilyen ID
                  const searchBtn = document.getElementById('landing-search-btn');     // Ha van ilyen ID
                  // Megjegyzés: A te HTML-edben fentebb 'fooldali-ai-kereso' az ID, 
                  // de ha van 'landing' ID-s elem is, ez a kód kezeli.

                  function startSearch() {
                        const queryText = searchInput.value.trim();
                        if (queryText) {
                              window.location.href = `src/html/vevo/ai-filter.html?query=${encodeURIComponent(queryText)}`;
                        }
                  }

                  if (searchBtn && searchInput) {
                        searchBtn.addEventListener('click', startSearch);
                        searchInput.addEventListener('keypress', (e) => {
                              if (e.key === 'Enter') startSearch();
                        });
                  }
            });
      </script>
      <script>
            function inditasMindenVideo() {
                  console.log("🎬 Összes videó indítása...");

                  // 1. TÖRÖLJÜK a korábbi szűrést (ez a lényeg!)
                  sessionStorage.removeItem('shorts_playlist');

                  // 2. Navigálunk a jó fájlra (a te útvonalad szerint)
                  window.location.href = 'shorts/simple-player.html';
            }
